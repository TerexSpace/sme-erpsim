[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-erpsim"
version = "0.1.0"
description = "SME-ERPSim: A discrete-event simulation engine for SME ERP processes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Almas Ospanov", email = "a.ospanov@astanait.edu.kz" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "simpy>=4.0.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "tabulate>=0.9",
]

[project.urls]
homepage = "https://github.com/TerexSpace/sme-erpsim"
repository = "https://github.com/TerexSpace/sme-erpsim"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
"sme-erpsim" = "sme_erpsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
